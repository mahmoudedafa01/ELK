input {
  beats {
    port => 5045
  }
}

filter {
  # ==========================================
  # 1. معالجة الـ SMS Logs
  # ==========================================
  if [fields][log_type] == "sms" {
    csv {
      separator => ","
      columns => [
        "campname", "billing", "reciver", "sendername", 
        "time", "status", "seg_count", "camp_id", "sms_id", "account_id",
        "sms_text", "language", "delivery_date", "encrypted"
      ]
    }

    if [campname] == "campname" { 
      drop { } 
    }

    mutate {
      strip => ["campname", "billing", "reciver", "sendername", "time", "status", "seg_count", "camp_id", "sms_id", "account_id", "sms_text", "language", "delivery_date"]
    }

    if [time] and [time] != "" and [time] != "null" and [time] != "0" {
      date {
        match => [ "time", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
        target => "@timestamp"
        timezone => "Africa/Cairo"
      }
    } else if [delivery_date] and [delivery_date] != "" and [delivery_date] != "null" and [delivery_date] != "0" {
      date {
        match => [ "delivery_date", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
        target => "@timestamp"
        timezone => "Africa/Cairo"
      }
    }

    if [delivery_date] and [delivery_date] != "" and [delivery_date] != "null" and [delivery_date] != "0" {
      date {
        match => [ "delivery_date", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
        target => "deliveryDate_parsed"
        timezone => "Africa/Cairo"
      }
    }

    ruby {
      code => '
        r = event.get("reciver").to_s.strip
        if r.start_with?("010", "2010", "10")
          event.set("operator", "vodafone")
        elsif r.start_with?("012", "2012", "12")
          event.set("operator", "orange")
        elsif r.start_with?("011", "2011", "11")
          event.set("operator", "etisalat")
        elsif r.start_with?("015", "2015", "15")
          event.set("operator", "we")
        else
          event.set("operator", "international")
        end
      '
    }

    mutate {
      remove_field => [ "message", "log", "input", "ecs", "agent", "@version" ]
      add_field => {
        "pipeline"    => "web2sms_sms"
      }
      copy => {
        "sms_text" => "smsText"
      }
      strip => ["campname", "billing", "reciver", "sendername", "time", "status", "seg_count", "camp_id", "sms_id", "account_id", "sms_text", "smsText", "language", "delivery_date", "operator"]
      convert => {
        "seg_count" => "integer"
        "encrypted" => "boolean"
      }
    }
  }

  # ==========================================
  # 2. معالجة الـ Campaigns Logs
  # ==========================================
  else if [fields][log_type] == "campaign" {
    csv {
      separator => ","
      columns => [
        "accountId", "campaignId", "campaignName", "campaignType", 
        "sender", "billingMSISDN", "processingDate", "status", 
        "smsCount", "segCount", "basicPrice",
        "frequency", "tier", "tierBasePrice", "smsPrice", 
        "campaignPrice", "numberOfCriteria", "whiteLists", "lbaTemplates",
        "startTimestamp", "endTimestamp", "tagIds", "smsText", "encrypted",
        "campaignAgency", "campaignClient"
      ]
    }

    if [accountId] == "Account ID" or [accountId] == "accountId" { 
      drop { } 
    }

    date {
      match => [ "processingDate", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
      timezone => "Africa/Cairo"
    }

    if [startTimestamp] {
      date {
        match => [ "startTimestamp", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss" ]
        target => "startTimestamp_parsed"
        timezone => "Africa/Cairo"
      }
    }

    if [endTimestamp] {
      date {
        match => [ "endTimestamp", "yyyyMMddHHmmss", "yyyy-MM-dd HH:mm:ss" ]
        target => "endTimestamp_parsed"
        timezone => "Africa/Cairo"
      }
    }

    if [tagIds] {
      mutate {
        split => { "tagIds" => ";" }
      }
    }

    if [lbaTemplates] and [lbaTemplates] =~ "^\[.*\]$" {
      json {
        source => "lbaTemplates"
        target => "lbaTemplatesParsed"
        skip_on_invalid_json => true
      }
    }

    # processingDate is the campaign's creation time, so it cannot order status
    # changes. Derive an ordering token from the export filename instead; this must
    # run before the mutate below strips [log].
    ruby {
      id => "campaign_cdr_version"
      code => '
        path = event.get("[log][file][path]").to_s
        m = path.match(/(\d{4})(\d{2})(\d{2})_(\d{2})-(\d{2})\.csv\z/)
        if m
          t = Time.new(m[1].to_i, m[2].to_i, m[3].to_i, m[4].to_i, m[5].to_i, 0)
          event.set("[@metadata][cdr_version]", t.to_i)
        else
          ts = event.get("@timestamp")
          event.set("[@metadata][cdr_version]", ts.nil? ? 0 : ts.to_f.to_i)
        end
      '
    }

    mutate {
      remove_field => [ "message", "log", "input", "ecs", "agent", "@version" ]
      add_field => {
        "pipeline"    => "web2sms_campaign"
      }
      strip => ["accountId", "campaignId", "campaignName", "campaignType", "sender", "billingMSISDN", "processingDate", "status", "frequency", "tier", "whiteLists", "lbaTemplates", "smsText", "campaignAgency", "campaignClient"]
      
      convert => {
        "smsCount"         => "integer"
        "segCount"         => "integer"
        "basicPrice"       => "float"
        "tierBasePrice"    => "float"
        "smsPrice"         => "float"
        "campaignPrice"    => "float"
        "numberOfCriteria" => "integer"
        "encrypted"        => "boolean"
      }
    }
  }
}

output {
  # ==========================================
  # توجيه الـ SMS للأندكس الخاص بيها
  # ==========================================
  if [fields][log_type] == "sms" {
    elasticsearch {
      hosts                 => ["https://localhost:9200"]
      user                  => "${ES_USER}"
      password              => "${ES_PASSWORD}"
      ssl_enabled           => true
      ssl_verification_mode => "none"
      index                 => "web2sms-sms-%{+YYYY.MM.dd}"
      document_id           => "%{sms_id}"
    }

  } 
  # ==========================================
  # توجيه الـ Campaigns للأندكس الخاص بيها
  # ==========================================
  else if [fields][log_type] == "campaign" {
    elasticsearch {
      hosts                 => ["https://localhost:9200"]
      user                  => "${ES_USER}"
      password              => "${ES_PASSWORD}"
      ssl_enabled           => true
      ssl_verification_mode => "none"
      index                 => "web2sms-campaigns-%{+YYYY.MM.dd}"
      document_id           => "%{campaignId}_%{processingDate}"
      version               => "%{[@metadata][cdr_version]}"
      version_type          => "external_gte"
      # A stale CDR file losing to a newer one is the intended outcome, not an error.
      silence_errors_in_log => ["version_conflict_engine_exception"]
    }
  }
}
